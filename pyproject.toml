[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "double-wiebe"
version = "1.0.0"
description = "Double Wiebe Combustion Analysis — two-phase Wiebe model with CLI (Typer) and GUI (Streamlit)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "L. Queiroz / I. L. Ferreira (modelo Single Wiebe); extensão Double Wiebe" }]
keywords = ["combustion", "wiebe", "engine", "thermodynamics", "calibration"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "plotly>=5.18",
    "matplotlib>=3.7",
    "streamlit>=1.30",
    "typer>=0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Aceleração (plano HPC): a base roda sem nenhum extra (regras 5/6).
cpu = ["numba>=0.59"]           # RK4 em lote compilado (backend cpu)
cuda = ["cupy-cuda12x>=13.0"]   # opcional — detecção em backends.detection
opencl = ["pyopencl"]           # opcional — detecção em backends.detection
gui = ["streamlit>=1.30"]
dev = ["pytest>=7.0", "pytest-timeout>=2.1", "streamlit>=1.30"]

[project.scripts]
double-wiebe = "double_wiebe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: testes longos (benchmark, multiprocessing, DE completo)",
]